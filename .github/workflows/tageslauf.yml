# Tageslauf (Baustein 3, Session 6): stündlich von etwa 05:00 Uhr bis Mitternacht deutscher Zeit Transaktionen,
# Pool-Auszug und Wetter sichern, dann rechnen, testen, committen (Beschluss Stephan 02.10.2026: durchgehend stündlich,
# erster Lauf etwa 05:00 Uhr; die frühere Nachmittagslücke 11:45–15:40 UTC entfällt).
# Zeitplan in deutscher Zeit (timezone "Europe/Berlin" je cron-Eintrag, GitHub rechnet Sommer- und Winterzeit selbst):
# 04:45–16:45 Uhr und 17:40–23:40 Uhr = 13 + 7 = 20 Läufe je Tag. GitHub startet erfahrungsgemäß 10–16 min später,
# also etwa 04:57 … 16:57 und 17:52 … 23:52 Uhr. Die Slots des alten UTC-Plans (in Sommerzeit 08:45–13:45 und
# 17:40–23:40 Uhr) bleiben minutengenau erhalten, neu sind 04:45–07:45 und 14:45–16:45 Uhr.
# Warum deutsche Zeit statt UTC: „ab 05:00 Uhr“ ist Ortszeit, und nach der US-Umstellung am 01.11. liegen die
# NFL-Anstöße in deutscher Zeit wieder wie jetzt – UTC-Slots verrutschten dann eine Stunde gegen die Spiele. Nur in der
# Woche 25.10.–01.11.2026 (Europa schon Winterzeit, USA noch nicht) liegen die Anstöße in deutscher Zeit eine Stunde
# früher (Sonntagsspiele ab 18:00 statt 19:00 Uhr); weil die Läufe durchgehend stündlich kommen, ändert das nur,
# welcher Lauf etwas zuerst sieht.
# Minuten: :45 am Vormittag, damit ein Lauf die Waiver-Ergebnisse trifft (ESPN meldet 07:00 UTC, sichtbar sind sie
# erfahrungsgemäß erst 10:30–11:00 Uhr deutscher Zeit); :40 im Abendblock wie bisher (News-Zeit 18–22 Uhr, sonntags die
# Inactives 90 min vor dem Anstoß und die späten Kickoffs) – die Wirkung der Minute ist nicht gemessen, deshalb unverändert.
# Kein Slot liegt in der Umstellungsstunde 02:00–03:00 Uhr (25.10.2026, 28.03.2027), keiner fällt also aus oder kommt
# doppelt. tests/test_zeitplan.py hält diesen Plan, die Anzeige „Nächster Tageslauf“ (app/js/app.js, DAILY) und die
# Zeiten in Glossar und README zusammen – wer die cron-Zeilen ändert, zieht dort nach.
# espn_fetch.py holt alle Transaktions-Perioden (0 … laufend), den Pool-Auszug (Status, Besitz, Verletzung, Waiver-Frist,
# Projektion; dazu die Waiver-Reihenfolge der Teams aus mTeam und die IR-Slots aus mRoster), das Wetter (Open-Meteo: Prognose der laufenden Woche, Ist-Wetter gespielter Spiele) und
# höchstens einmal je UTC-Tag die Marktwerte von FantasyCalc (--marktwert, Keeper-Tab; Ausfall = Warnung) und schreibt nur,
# was sich geändert hat. Danach rechnet das Rechenwerk neu; die abgeleiteten Dateien (season_2026.json, app/data) kommen
# nur bei grünem Rechenwerk und grünen Tests mit, Rohdaten immer. News je Spieler (--news, Stufe 2) ist vorbereitet,
# bleibt aber aus (Beschluss Stephan 30.09.2026, CLAUDE.md „Gelernt“: Rotowire-Meldungen sind Volltext ohne Link).
name: Tageslauf

on:
  schedule:
    # Stunden in deutscher Zeit (timezone); in UTC: Sommerzeit −2 h, Winterzeit −1 h
    - cron: "45 4-16 * * *"       # stündlich 04:45–16:45 Uhr, 13 Läufe (MESZ 02:45–14:45 UTC, MEZ 03:45–15:45 UTC)
      timezone: "Europe/Berlin"
    - cron: "40 17-23 * * *"      # stündlich 17:40–23:40 Uhr, 7 Läufe (MESZ 15:40–21:40 UTC, MEZ 16:40–22:40 UTC)
      timezone: "Europe/Berlin"
  workflow_dispatch:          # von Hand: Actions › Tageslauf › Run workflow oder gh workflow run tageslauf.yml

permissions:
  contents: write

concurrency:
  group: daten-commit         # gemeinsam mit dem Wochenabruf: nie zwei Commits gleichzeitig, der spätere wartet
  cancel-in-progress: false

jobs:
  tageslauf:
    runs-on: ubuntu-24.04     # fest statt ubuntu-latest (wechselt ab 19.10.2026 auf Ubuntu 26)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Transaktionen, Pool-Auszug, Wetter und Marktwerte holen
        run: python scripts/espn_fetch.py --transactions --pool --wetter --marktwert   # ohne --news (News Stufe 2 bleibt aus)

      # Auch nach einem Teilfehler des Abrufs rechnen und sichern, was schon geholt ist (der Lauf bleibt trotzdem rot).
      - name: Rechenwerk
        id: rechenwerk
        if: ${{ !cancelled() }}
        run: python scripts/compute.py

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.rechenwerk.outcome == 'success' }}
        run: python -m pytest -q

      - name: Committen und pushen (nur bei Änderung)
        if: ${{ !cancelled() }}
        env:
          ABGELEITET: ${{ steps.rechenwerk.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw   # stellt auch gelöschte Prognosen der Vorwoche bereit
          if [ "$ABGELEITET" = "true" ]; then
            git add data/season_*.json app/data
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung – nichts zu committen."
            exit 0
          fi
          if [ "$ABGELEITET" = "true" ]; then
            git commit -m "Tageslauf (Action): Stand $(date -u '+%d.%m.%Y %H:%M') UTC."
          else
            git commit -m "Tageslauf (Action): Stand $(date -u '+%d.%m.%Y %H:%M') UTC, Rechenwerk oder Tests fehlgeschlagen."
          fi
          # --autostash: nicht committete abgeleitete Dateien (rotes Rechenwerk/Tests) beiseitelegen, sonst verweigert pull
          git pull --rebase --autostash
          git push
