# Tageslauf (Baustein 3, Session 6): stündlich vormittags und abends Transaktionen, Pool-Auszug und Wetter sichern,
# dann rechnen, testen, committen. Vormittag 06:45–11:45 UTC, damit ein Lauf die Waiver-Ergebnisse trifft (ESPN meldet
# 07:00 UTC, sichtbar sind sie erfahrungsgemäß erst 10:30–11:00 Uhr deutscher Zeit); Abendblock 15:40–21:40 UTC für die
# News-Zeit 18–22 Uhr, sonntags die Inactives vor dem 1-Uhr-Kickoff und die späten Kickoffs. 13 Läufe je Tag.
# espn_fetch.py holt alle Transaktions-Perioden (0 … laufend), den Pool-Auszug (Status, Besitz, Verletzung, Waiver-Frist,
# Projektion; dazu die Waiver-Reihenfolge der Teams aus mTeam und die IR-Slots aus mRoster) und das Wetter (Open-Meteo: Prognose der laufenden Woche, Ist-Wetter gespielter Spiele) und schreibt nur,
# was sich geändert hat. Danach rechnet das Rechenwerk neu; die abgeleiteten Dateien (season_2026.json, app/data) kommen
# nur bei grünem Rechenwerk und grünen Tests mit, Rohdaten immer. News je Spieler (--news, Stufe 2) ist vorbereitet,
# bleibt aber aus (Beschluss Stephan 30.09.2026, CLAUDE.md „Gelernt“: Rotowire-Meldungen sind Volltext ohne Link).
name: Tageslauf

on:
  schedule:
    - cron: "45 6-11 * * *"   # stündlich 06:45–11:45 UTC (08:45–13:45 MESZ / 07:45–12:45 MEZ)
    - cron: "40 15-21 * * *"  # stündlich 15:40–21:40 UTC (17:40–23:40 MESZ / 16:40–22:40 MEZ)
  workflow_dispatch:          # von Hand: Actions › Tageslauf › Run workflow oder gh workflow run tageslauf.yml

permissions:
  contents: write

concurrency:
  group: daten-commit         # gemeinsam mit dem Wochenabruf: nie zwei Commits gleichzeitig, der spätere wartet
  cancel-in-progress: false

jobs:
  tageslauf:
    runs-on: ubuntu-24.04     # fest statt ubuntu-latest (wechselt ab 19.10.2026 auf Ubuntu 26)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Transaktionen, Pool-Auszug und Wetter holen
        run: python scripts/espn_fetch.py --transactions --pool --wetter   # ohne --news (News Stufe 2 bleibt aus)

      # Auch nach einem Teilfehler des Abrufs rechnen und sichern, was schon geholt ist (der Lauf bleibt trotzdem rot).
      - name: Rechenwerk
        id: rechenwerk
        if: ${{ !cancelled() }}
        run: python scripts/compute.py

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.rechenwerk.outcome == 'success' }}
        run: python -m pytest -q

      - name: Committen und pushen (nur bei Änderung)
        if: ${{ !cancelled() }}
        env:
          ABGELEITET: ${{ steps.rechenwerk.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw   # stellt auch gelöschte Prognosen der Vorwoche bereit
          if [ "$ABGELEITET" = "true" ]; then
            git add data/season_*.json app/data
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung – nichts zu committen."
            exit 0
          fi
          if [ "$ABGELEITET" = "true" ]; then
            git commit -m "Tageslauf (Action): Stand $(date -u '+%d.%m.%Y %H:%M') UTC."
          else
            git commit -m "Tageslauf (Action): Stand $(date -u '+%d.%m.%Y %H:%M') UTC, Rechenwerk oder Tests fehlgeschlagen."
          fi
          # --autostash: nicht committete abgeleitete Dateien (rotes Rechenwerk/Tests) beiseitelegen, sonst verweigert pull
          git pull --rebase --autostash
          git push
